<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Fabino Admin</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Fabino Admin">
<style>
:root{--bg:#ece3cf;--card:#fff;--ink:#151008;--mute:#6b5d48;--line:#d9cdb2;--gold:#d4a82a;--bad:#c0482c;--ok:#2f7a3d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,Inter,sans-serif}
.w{max-width:640px;margin:0 auto;padding:16px}h1{font-family:Georgia,serif;text-transform:uppercase;font-size:22px;margin:8px 0}h2{font-family:Georgia,serif;font-size:18px;margin:0 0 8px;text-transform:uppercase}
.c{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:14px;margin-top:14px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:10px 0 3px}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--ink);color:#fff;font-weight:600;cursor:pointer}button.g{background:#fff;color:var(--ink);border:2px solid var(--ink)}button.r{background:var(--bad)}button.ok{background:var(--ok)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.s{font-size:13px;color:var(--mute)}.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;background:#fbf4de;border:1px solid var(--gold)}.pill.h{background:#f9dcd5;border-color:var(--bad);color:var(--bad)}
.p{border-top:1px solid var(--line);padding:10px 0}.err{color:var(--bad);font-size:13px;margin-top:6px;min-height:18px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.tabs button{padding:8px 12px;font-size:14px}.tabs .on{background:var(--gold);color:var(--ink)}
.hide{display:none}td,th{font-size:12.5px;text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}table{border-collapse:collapse;width:100%}.sc{overflow-x:auto}
</style></head><body><div class="w">
<h1>Fabino admin</h1>
<div id="login" class="c"><h2>Sign in</h2><p class="s">Enter your email. We send a 6-digit code.</p>
 <label>Email</label><input id="em" type="email" autocomplete="email"><div id="codeBox" class="hide"><label>6-digit code</label><input id="cd" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></div>
 <p><button id="goBtn" onclick="login()">Send code</button></p><div class="err" id="lerr"></div></div>
<div id="app" class="hide">
 <div class="c" style="display:flex;justify-content:space-between;align-items:center"><div><b id="who"></b><div class="s" id="roleTxt"></div></div><button class="g" onclick="logout()">Log out</button></div>
 <div class="tabs" id="tabs"></div>
 <div id="t-pending"></div><div id="t-prices" class="hide"></div><div id="t-bank" class="hide"></div><div id="t-specials" class="hide"></div><div id="t-orders" class="hide"></div><div id="t-roles" class="hide"></div><div id="t-audit" class="hide"></div>
</div></div>
<script>
const $=id=>document.getElementById(id);let ST=null,tab='pending';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(a,body){const r=await fetch('/api/fabino?a='+a,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','x-fab':'1'},body:body?JSON.stringify(body):undefined,credentials:'same-origin'});
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Error');return j}
let step=0;
async function login(){try{$('lerr').textContent='';
 if(!step){const j=await api('otp_request',{email:$('em').value});step=1;$('codeBox').classList.remove('hide');$('goBtn').textContent='Sign in';$('lerr').textContent='If that email is allowed, a code is on its way.';if(j.dev)$('cd').value=j.dev}
 else{await api('otp_verify',{email:$('em').value,code:$('cd').value});load()}}catch(e){$('lerr').textContent=e.message}}
async function logout(){await api('logout',{});location.reload()}
async function load(){try{ST=await api('state');}catch(e){$('login').classList.remove('hide');return}
 $('login').classList.add('hide');$('app').classList.remove('hide');$('who').textContent=ST.me.email;$('roleTxt').textContent=ST.me.role==='owner'?'Owner':'Admin';render()}
const TABS=[['pending','Approvals'],['prices','Prices & rules'],['bank','Bank & business'],['specials','Specials'],['orders','Orders'],['roles','Roles'],['audit','Audit log']];
function render(){$('tabs').innerHTML=TABS.map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render()">${l}${k==='pending'&&ST.pending.filter(p=>p.status==='pending'||p.status==='holding').length?' ('+ST.pending.filter(p=>p.status==='pending'||p.status==='holding').length+')':''}</button>`).join('');
 TABS.forEach(([k])=>$('t-'+k).classList.toggle('hide',k!==tab));({pending:rPending,prices:rPrices,bank:rBank,specials:rSpecials,orders:rOrders,roles:rRoles,audit:rAudit})[tab]()}
const C=()=>ST.config;
function rPending(){const L=ST.pending;$('t-pending').innerHTML=`<div class="c"><h2>Waiting for approval</h2><p class="s">You can't approve your own change. The other person does. Bank and role changes also need a code sent to your email.</p>${L.length?L.map(p=>`<div class="p"><span class="pill ${p.risk!=='normal'?'h':''}">${p.risk==='normal'?'Normal':p.risk==='high'?'High risk':'Highest security'}</span> <span class="pill">${esc(p.status)}</span><div><b>${esc(p.summary)}</b></div><div class="s">By ${esc(p.by)} · ${new Date(p.at).toLocaleString()}${p.applyAfter?' · takes effect '+new Date(p.applyAfter).toLocaleString():''}</div>
 ${p.status==='pending'&&p.by!==ST.me.email?`<div id="ap-${p.id}" style="margin-top:8px">${p.risk!=='normal'?`<button class="g" onclick="stepup('${p.id}')">Email me an approval code</button> <input id="cd-${p.id}" placeholder="6-digit code" inputmode="numeric" maxlength="6" style="margin-top:6px">`:''}<p><button class="ok" onclick="approve('${p.id}')">Approve</button> <button class="r" onclick="rej('${p.id}')">Reject</button></p></div>`:''}
 ${p.status==='pending'&&p.by===ST.me.email?`<p><button class="g" onclick="rej('${p.id}')">Withdraw</button></p>`:''}${p.status==='holding'?`<p><button class="r" onclick="rej('${p.id}')">Cancel this change</button></p>`:''}</div>`).join(''):'<p class="s">Nothing waiting.</p>'}<div class="err" id="perr"></div></div>`}
async function stepup(id){try{const j=await api('stepup_request',{id});$('perr').textContent='Code sent to your email.';if(j.dev)$('cd-'+id).value=j.dev}catch(e){$('perr').textContent=e.message}}
async function approve(id){try{const c=$('cd-'+id);await api('approve',{id,code:c?c.value:undefined});await load()}catch(e){$('perr').textContent=e.message}}
async function rej(id){try{await api('reject',{id});await load()}catch(e){$('perr').textContent=e.message}}
function fld(id,l,v,t){return `<div><label>${l}</label><input id="${id}" value="${esc(v)}" ${t?`type="${t}"`:''}></div>`}
const PN=[['beans250','Beans 250 g'],['beans500','Beans 500 g'],['beans1000','Beans 1 kg'],['jdark','Jovo Dark box'],['jmed','Jovo Medium box'],['jdec','Jovo Decaf box']];
function rPrices(){const c=C();$('t-prices').innerHTML=`<div class="c"><h2>Prices &amp; rules</h2><p class="s">Prices include VAT. Changes go to the other person for approval. Live prices stay the same until then.</p><div class="row">${PN.map(([k,l])=>fld('pr-'+k,l+' (R)',c.prices[k])).join('')}</div>
 <h2 style="margin-top:14px">Rules</h2><div class="row">${fld('ru-deliveryFee','Delivery fee (R)',c.rules.deliveryFee)}${fld('ru-freeOver','Free delivery over (R)',c.rules.freeOver)}${fld('ru-subDisc','Subscription discount %',c.rules.subDisc)}${fld('ru-cutoffHour','Order cut-off hour',c.rules.cutoffHour)}${fld('ru-window','Delivery window',c.rules.window)}</div>
 <p><button onclick="submitPrices()">Submit for approval</button></p><div class="err" id="e1"></div></div>`}
function diff(group,prefix,keys){const o={};keys.forEach(k=>{const v=$(prefix+k).value.trim();if(String(C()[group][k])!==v)o[k]=v});return o}
async function submitPrices(){try{const patch={prices:diff('prices','pr-',PN.map(x=>x[0])),rules:diff('rules','ru-',['deliveryFee','freeOver','subDisc','cutoffHour','window'])};
 Object.keys(patch).forEach(g=>{if(!Object.keys(patch[g]).length)delete patch[g]});if(!Object.keys(patch).length)throw new Error('You have not changed anything');await api('propose',{kind:'config',patch});tab='pending';await load()}catch(e){$('e1').textContent=e.message}}
function rBank(){const b=C().bank,u=C().business;$('t-bank').innerHTML=`<div class="c"><h2>Business details</h2><div class="row">${fld('bu-name','Business name',u.name)}${fld('bu-city','Address / city',u.city)}${fld('bu-phone','Phone',u.phone)}${fld('bu-email','Email',u.email)}${fld('bu-vatNo','VAT number',u.vatNo)}${fld('bu-vatRate','VAT %',u.vatRate)}</div><p><button onclick="submitBiz()">Submit for approval</button></p><div class="err" id="e2"></div></div>
 <div class="c"><h2>Banking details <span class="pill h">High risk</span></h2><p class="s">Needs an email code from you, then the other person approves with their own code. Both of you get an alert.</p><div class="row">${fld('bk-bankName','Bank',b.bankName)}${fld('bk-accHolder','Account holder',b.accHolder)}${fld('bk-accNo','Account number',b.accNo)}${fld('bk-branch','Branch code',b.branch)}${fld('bk-accType','Account type',b.accType)}${fld('bk-payRef','Payment reference',b.payRef)}</div>
 <p><button class="g" onclick="bankCode()">Email me a code</button></p>${fld('bk-code','Your 6-digit code','')}<p><button onclick="submitBank()">Submit for approval</button></p><div class="err" id="e3"></div></div>`}
async function submitBiz(){try{const o=diff('business','bu-',['name','city','phone','email','vatNo','vatRate']);if(!Object.keys(o).length)throw new Error('You have not changed anything');await api('propose',{kind:'config',patch:{business:o}});tab='pending';await load()}catch(e){$('e2').textContent=e.message}}
async function bankCode(){try{const j=await api('stepup_request',{id:'new'});$('e3').textContent='Code sent to your email.';if(j.dev)$('bk-code').value=j.dev}catch(e){$('e3').textContent=e.message}}
async function submitBank(){try{const o=diff('bank','bk-',['bankName','accHolder','accNo','branch','accType','payRef']);if(!Object.keys(o).length)throw new Error('You have not changed anything');await api('propose',{kind:'config',patch:{bank:o},code:$('bk-code').value});tab='pending';await load()}catch(e){$('e3').textContent=e.message}}
const PR=['house','allora','forte','espresso','cafe','mokka','jdark','jmed','jdec'];
function rSpecials(){const L=C().specials;$('t-specials').innerHTML=`<div class="c"><h2>Specials &amp; recipes</h2><p class="s">Shown on the customer's invoice as cards (up to 5). The first line shows on the card; the rest opens under &quot;Read recipe&quot; and is printed on the customer's invoice once they add it.</p>${[0,1,2,3,4].map(i=>{const s=L[i]||{t:'',x:'',pid:'forte'};return `<div class="p"><label>Title</label><input id="sp-t${i}" value="${esc(s.t)}"><label>Recipe or description (one step per line, up to 1200 characters)</label><textarea id="sp-x${i}" rows="7" maxlength="1200" placeholder="Short description on the first line, then the ingredients and steps, one per line.">${esc(s.x)}</textarea><div class="row"><div><label>Adds product</label><select id="sp-p${i}">${PR.map(p=>`<option ${p===s.pid?'selected':''}>${p}</option>`).join('')}</select></div><div><label>Grind (beans)</label><select id="sp-g${i}">${['whole','espresso','filter','plunger','moka'].map(g=>`<option ${g===(s.grind||'whole')?'selected':''}>${g}</option>`).join('')}</select></div></div></div>`}).join('')}<p><button onclick="submitSpecials()">Submit for approval</button></p><div class="err" id="e4"></div></div>`}
async function submitSpecials(){try{const sp=[0,1,2,3,4].filter(i=>$('sp-t'+i).value.trim()).map(i=>({t:$('sp-t'+i).value,x:$('sp-x'+i).value,pid:$('sp-p'+i).value,size:500,grind:$('sp-g'+i).value}));await api('propose',{kind:'config',patch:{specials:sp}});tab='pending';await load()}catch(e){$('e4').textContent=e.message}}
function rOrders(){const sv=ST.services||[];$('t-orders').innerHTML=`<div class="c"><h2>JURA service requests</h2>${sv.length?sv.map(x=>`<div class="p"><b>${esc(x.type)}</b> · ${esc(x.model)||'model not given'} <span class="s">${esc(x.ref)}</span><div>${esc(x.name)} · ${esc(x.phone)} · ${esc(x.email)}</div><div class="s">${esc(x.notes)}${x.when?' · '+esc(x.when):''} · ${new Date(x.at).toLocaleString()}</div></div>`).join(''):'<p class="s">No requests yet</p>'}</div>`+`<div class="c"><h2>Orders</h2><p><a href="/api/fabino?a=export"><button class="g">Download CSV (for GAAP / accountant)</button></a></p><div class="sc"><table><tr><th>No.</th><th>Customer</th><th>Total</th><th>Status</th></tr>${ST.orders.map(o=>`<tr><td>${esc(o.no)}</td><td>${esc(o.customer.name)}<br><span class="s">${esc(o.customer.phone)}</span></td><td>R${o.totals.total.toFixed(2)}</td><td>${esc(o.status)}</td></tr>`).join('')||'<tr><td colspan=4 class="s">No orders yet</td></tr>'}</table></div></div>`}
function rRoles(){const r=ST.roles;$('t-roles').innerHTML=`<div class="c"><h2>Owner &amp; admin <span class="pill h">Highest security</span></h2><p class="s">Now: owner <b>${esc(r.owner)}</b>, admin <b>${esc(r.admin)}</b>.<br>Changing either person needs: a code from you, the other person's approval with their own code, then a 24-hour hold. Both of you are emailed and either can cancel during the hold.</p>${fld('rl-owner','New owner email','')}${fld('rl-admin','New admin email','')}<p><button class="g" onclick="roleCode()">Email me a code</button></p>${fld('rl-code','Your 6-digit code','')}<p><button onclick="submitRoles()">Start role change</button></p><div class="err" id="e5"></div></div>`}
async function roleCode(){try{const j=await api('stepup_request',{id:'new'});$('e5').textContent='Code sent to your email.';if(j.dev)$('rl-code').value=j.dev}catch(e){$('e5').textContent=e.message}}
async function submitRoles(){try{await api('propose',{kind:'roles',owner:$('rl-owner').value.trim()||undefined,admin:$('rl-admin').value.trim()||undefined,code:$('rl-code').value});tab='pending';await load()}catch(e){$('e5').textContent=e.message}}
function rAudit(){$('t-audit').innerHTML=`<div class="c"><h2>Audit log</h2>${ST.audit.map(a=>`<div class="p"><b>${esc(a.action)}</b> · ${esc(a.who)}<div class="s">${new Date(a.at).toLocaleString()}</div><div class="s">${esc(a.summary)}</div></div>`).join('')||'<p class="s">Empty</p>'}</div>`}
load();
</script></body></html>
